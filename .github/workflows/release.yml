name: Release

# Builds the archives for a version tag and attaches them to a draft
# release, which a maintainer reviews and publishes by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 0.1, not 0.1.0
          case "$version" in *.*.0) version="${version%.0}" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Kinetic $version (beta)"
